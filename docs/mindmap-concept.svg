<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="600" fill="#faf9f5"/>
  <!-- panel frame -->
  <rect x="20" y="20" width="920" height="560" rx="14" fill="#ffffff" stroke="#d9d5c8"/>
  <!-- tab bar -->
  <rect x="20" y="20" width="920" height="52" rx="14" fill="#f3f1ea"/>
  <rect x="20" y="58" width="920" height="14" fill="#f3f1ea"/>
  <line x1="20" y1="72" x2="940" y2="72" stroke="#d9d5c8"/>
  <text x="44" y="52" font-size="14" fill="#8a8578">Session</text>
  <text x="124" y="52" font-size="14" fill="#8a8578">Inbox</text>
  <rect x="190" y="30" width="72" height="32" rx="8" fill="#ffffff" stroke="#d9d5c8"/>
  <text x="226" y="51" font-size="14" fill="#1f1e1b" font-weight="600" text-anchor="middle">Map</text>
  <rect x="704" y="32" width="216" height="28" rx="14" fill="#fdecea" stroke="#e3a59c"/>
  <text x="812" y="51" font-size="12" fill="#a8412f" font-weight="700" text-anchor="middle" letter-spacing=".5">CONCEPT · NOT BUILT (D7)</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5b0a3"/></marker>
  </defs>

  <!-- edges -->
  <g stroke="#b5b0a3" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M200 300 C 250 300, 250 150, 300 150"/>
    <path d="M200 300 L 300 300"/>
    <path d="M200 300 C 250 300, 250 450, 300 450"/>
    <path d="M470 150 C 520 150, 520 120, 570 120"/>
    <path d="M470 150 C 520 150, 520 180, 570 180"/>
    <path d="M470 300 C 520 300, 520 260, 570 260"/>
    <path d="M470 300 L 570 310"/>
    <path d="M470 300 C 520 300, 520 360, 570 360"/>
    <path d="M470 450 C 520 450, 520 420, 570 420"/>
    <path d="M470 450 C 520 450, 520 470, 570 470"/>
    <path d="M470 450 C 520 450, 520 520, 570 520"/>
  </g>

  <!-- root -->
  <rect x="40" y="262" width="160" height="76" rx="12" fill="#1f1e1b"/>
  <text x="120" y="292" font-size="12" fill="#cfcabd" text-anchor="middle">YOUR REQUEST</text>
  <text x="120" y="313" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Login page with</text>
  <text x="120" y="329" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">JWT auth</text>

  <!-- branch nodes -->
  <g font-size="13" font-weight="600">
    <rect x="300" y="126" width="170" height="48" rx="10" fill="#eef4fb" stroke="#8fb3d9"/>
    <text x="385" y="146" text-anchor="middle" fill="#2b5a8a">Sources consulted</text>
    <text x="385" y="163" text-anchor="middle" fill="#5b7fa6" font-weight="400" font-size="11">2 reads · done</text>

    <rect x="300" y="276" width="170" height="48" rx="10" fill="#fdf3e4" stroke="#e0b46b"/>
    <text x="385" y="296" text-anchor="middle" fill="#8a5a12">Decisions</text>
    <text x="385" y="313" text-anchor="middle" fill="#a57a36" font-weight="400" font-size="11">3 choices · 1 in progress</text>

    <rect x="300" y="426" width="170" height="48" rx="10" fill="#edf6ee" stroke="#8cc295"/>
    <text x="385" y="446" text-anchor="middle" fill="#2f6b3a">Files written</text>
    <text x="385" y="463" text-anchor="middle" fill="#5a8a62" font-weight="400" font-size="11">1 of 3</text>
  </g>

  <!-- leaves -->
  <g font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="570" y="104" width="200" height="32" rx="8" fill="#ffffff" stroke="#8fb3d9"/><text x="584" y="125" fill="#1f1e1b">package.json ✓</text>
    <rect x="570" y="164" width="200" height="32" rx="8" fill="#ffffff" stroke="#8fb3d9"/><text x="584" y="185" fill="#1f1e1b">middleware.ts ✓</text>

    <rect x="570" y="244" width="330" height="32" rx="8" fill="#ffffff" stroke="#e0b46b"/><text x="584" y="265" fill="#1f1e1b">bcrypt (cost 12) over SHA-256 ✓</text>
    <rect x="570" y="294" width="330" height="32" rx="8" fill="#ffffff" stroke="#e0b46b"/><text x="584" y="315" fill="#1f1e1b">JWT in httpOnly cookie, not localStorage ✓</text>
    <rect x="570" y="344" width="330" height="32" rx="8" fill="#fff8ec" stroke="#e0b46b" stroke-dasharray="4 3"/><text x="584" y="365" fill="#8a5a12">15-min access + refresh rotation …</text>

    <rect x="570" y="404" width="200" height="32" rx="8" fill="#ffffff" stroke="#8cc295"/><text x="584" y="425" fill="#1f1e1b">lib/auth.ts ✓</text>
    <rect x="570" y="454" width="200" height="32" rx="8" fill="#fbfaf6" stroke="#cfcabd" stroke-dasharray="4 3"/><text x="584" y="475" fill="#a39e90">middleware.ts</text>
    <rect x="570" y="504" width="200" height="32" rx="8" fill="#fbfaf6" stroke="#cfcabd" stroke-dasharray="4 3"/><text x="584" y="525" fill="#a39e90">app/login/page.tsx</text>
  </g>

  <!-- caption -->
  <text x="40" y="556" font-size="12" fill="#8a8578">Live map of the main agent's work: sources, decisions, files. Parked as passive (the "felt taught" risk); a candidate A/B arm only.</text>
</svg>
